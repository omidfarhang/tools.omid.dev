worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    access_log /var/log/nginx/access.log;

    # PHP-FPM from the official image listens on 9000.
    upstream php_fpm {
        server 127.0.0.1:9000;
    }

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Public share links: /s/{token} → share_download.php
        location ~ ^/s/([A-Fa-f0-9]+)$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/share_download.php;
            fastcgi_param QUERY_STRING token=$1&$query_string;
            fastcgi_pass php_fpm;
            fastcgi_read_timeout 600s;
            fastcgi_send_timeout 600s;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location ~ \.php$ {
            try_files $uri =404;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass php_fpm;
            fastcgi_read_timeout 600s;
            fastcgi_send_timeout 600s;
        }

        # Defense in depth: never serve anything outside public/
        location ~ /\. {
            deny all;
        }
    }
}
