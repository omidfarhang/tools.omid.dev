services:
  app:
    image: ghcr.io/omidfarhang/tools.omid.dev:${IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      # Host port → container 8080. Override with APP_PORT=9080 in .env if 8080 is taken.
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DB_PATH: /var/www/html/storage/app.db
      TEMP_DIR: /var/www/html/storage/temp
      YTDLP_COOKIES_PATH: /var/www/html/storage/ytdlp-cookies.txt
    volumes:
      - ./storage:/var/www/html/storage
    restart: unless-stopped
