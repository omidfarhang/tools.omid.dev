# Copy to /etc/fail2ban/jail.d/ and set logpath to the host path of storage/logs/auth.log
# (Docker: same directory as the ./storage volume mount).

[tools-omid-dev]
enabled  = true
filter   = tools-omid-dev
logpath  = /path/to/tools.omid.dev/storage/logs/auth.log
backend  = auto
maxretry = 10
findtime = 900
bantime  = 3600
